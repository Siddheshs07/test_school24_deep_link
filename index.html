<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School24 - Opening App...</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .loader-container {
        text-align: center;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 24px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-text {
        color: white;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body onload="openApp()">
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="loader-text">Loading app...</div>
    </div>

    <script>
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);
      const isMobile = isIOS || isAndroid;

      // Get the path from URL parameters (e.g., ?path=/records)
      const urlParams = new URLSearchParams(window.location.search);
      const path = urlParams.get("path") || "/records";

      function openApp() {
        if (!isMobile) {
          // Desktop - redirect to website
          window.location.href = "https://app.school24.net.au";
          return;
        }

        if (isAndroid) {
          const fallback = encodeURIComponent(
            "https://play.google.com/store/apps/details?id=com.school24.parent",
          );
          window.location.href = `intent:/${path}#Intent;scheme=school24;package=com.school24.parent;S.browser_fallback_url=${fallback};end`;
        } else if (isIOS) {
          window.location.href = `school24:/${path}`;

          setTimeout(() => {
            if (document.hasFocus()) {
              window.location.href = "https://apps.apple.com/app/id6738653899";
            }
          }, 2000);
        }
      }
    </script>
  </body>
</html>
